name: Python SDK CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SDK and build tools
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e .
      - name: Run SDK unit tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic example
        run: |
          python examples/refund.py
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("examples")
          run = json.loads((root / "refund-run.json").read_text())
          request = json.loads((root / "refund-request.json").read_text())
          assert run["schemaVersion"] == "0.1"
          assert request["execution"]["schemaVersion"] == "0.1"
          assert request["evidence"]["coverage"] == "partial"
          assert request["evidence"]["requirements"]
          PY
      - name: Build wheel and source distribution
        run: python -m build . --outdir dist
      - name: Verify distribution metadata and license
        run: |
          python -m twine check dist/*
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          assert len(wheels) == len(sdists) == 1, (wheels, sdists)

          with zipfile.ZipFile(wheels[0]) as archive:
              paths = archive.namelist()
              assert any(path.endswith(".dist-info/licenses/LICENSE") for path in paths), paths
              assert any(path.endswith(".dist-info/licenses/NOTICE") for path in paths), paths
              metadata_path = next(path for path in paths if path.endswith(".dist-info/METADATA"))
              metadata = archive.read(metadata_path).decode()
              assert "License-Expression: Apache-2.0" in metadata, metadata

          with tarfile.open(sdists[0]) as archive:
              paths = archive.getnames()
              assert any(path.endswith("/LICENSE") for path in paths), paths
              assert any(path.endswith("/NOTICE") for path in paths)

          print("Apache-2.0 wheel/sdist checks passed")
          PY
      - name: Smoke test installed wheel
        run: |
          python -m pip uninstall -y traser-sdk
          python -m pip install dist/*.whl
          python -c 'from traser_sdk import Traser; assert Traser().run("smoke").to_run()["schemaVersion"] == "0.1"'
